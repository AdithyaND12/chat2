[project]
name = "nova-assistant"
version = "0.1.0"
description = "A local-first, voice-controlled AI assistant built with LangChain and LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "openai>=1.50.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "numpy>=1.26,<3",
    "sounddevice>=0.5",
    "openwakeword>=0.6",
    "edge-tts>=6.1",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "streamlit>=1.38",
    "streamlit-autorefresh>=1.0",
    "pytest>=8.3",
]

[project.scripts]
nova = "assistant.cli:main"
nova-dashboard = "assistant.dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
